name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Browser analyzer self-test
        run: node tests/browser-analyzer-selftest.mjs docs/m6-status/timeline-browser/app.js

      - name: Sonic Chronicle regression
        run: |
          node --check docs/m6-status/sonic-chronicle/app.js
          node tests/sonic-chronicle-regression.mjs \
            docs/m6-status/sonic-chronicle/app.js \
            docs/m6-status/sonic-chronicle/index.html \
            docs/m6-status/sonic-chronicle/style.css

      - name: Segment Forest regression
        run: node tests/segment-forest-regression.mjs docs/m6-status/segment-forest/index.html

      - name: Annotation Explorer regression
        run: node tests/annotation-explorer-regression.mjs docs/m6-status/annotation-explorer/index.html

      - name: Vocal Separation Lab regression
        run: |
          node --check docs/test/vocal-separation-lab/app.js
          node tests/vocal-separation-lab-regression.mjs docs/test/vocal-separation-lab/index.html docs/test/vocal-separation-lab/app.js docs/test/vocal-separation-lab/style.css

      - name: Vocal Separation Lab browser regression
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          "$CHROME" --version
          python3 -m http.server 4173 --bind 127.0.0.1 --directory docs >/tmp/vocal-lab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/test/vocal-separation-lab/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --virtual-time-budget=10000 \
            --dump-dom \
            "http://127.0.0.1:4173/test/vocal-separation-lab/?selftest=1" \
            > /tmp/vocal-lab-browser.html
          grep -q 'data-browser-selftest="PASS"' /tmp/vocal-lab-browser.html
          grep -q 'browser self-test: PASS (mid-file crop + repeated separation reset)' /tmp/vocal-lab-browser.html
          echo "Vocal Separation Lab browser regression: PASS"

      - name: Vocal Model Comparator regression
        run: |
          node --check docs/test/vocal-model-comparator/app.js
          node tests/vocal-model-comparator-regression.mjs \
            docs/test/vocal-model-comparator/index.html \
            docs/test/vocal-model-comparator/app.js \
            docs/test/vocal-model-comparator/style.css

      - name: Vocal Model Comparator browser regression
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 4174 --bind 127.0.0.1 --directory docs >/tmp/vocal-comparator-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/test/vocal-model-comparator/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --virtual-time-budget=10000 \
            --dump-dom \
            "http://127.0.0.1:4174/test/vocal-model-comparator/?selftest=1" \
            > /tmp/vocal-comparator-browser.html
          grep -q 'data-comparator-selftest="PASS"' /tmp/vocal-comparator-browser.html
          grep -q 'comparator browser self-test: PASS' /tmp/vocal-comparator-browser.html
          echo "Vocal Model Comparator browser regression: PASS"

      - name: Vocal Isolation Inspector regression
        run: |
          node --check docs/test/vocal-isolation-inspector/app.js
          node tests/vocal-isolation-inspector-regression.mjs \
            docs/test/vocal-isolation-inspector/index.html \
            docs/test/vocal-isolation-inspector/app.js \
            docs/test/vocal-isolation-inspector/style.css

      - name: Vocal Isolation Inspector browser regression
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 4175 --bind 127.0.0.1 --directory docs >/tmp/vocal-inspector-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4175/test/vocal-isolation-inspector/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --virtual-time-budget=12000 \
            --dump-dom \
            "http://127.0.0.1:4175/test/vocal-isolation-inspector/?selftest=1" \
            > /tmp/vocal-inspector-browser.html
          grep -q 'data-inspector-selftest="PASS"' /tmp/vocal-inspector-browser.html
          grep -q 'inspector browser self-test: PASS' /tmp/vocal-inspector-browser.html
          echo "Vocal Isolation Inspector browser regression: PASS"

      - name: Stem Dominance Map regression
        run: |
          node --check docs/test/stem-dominance-map/app.js
          node tests/stem-dominance-map-regression.mjs \
            docs/test/stem-dominance-map/index.html \
            docs/test/stem-dominance-map/app.js \
            docs/test/stem-dominance-map/style.css

      - name: Stem Dominance Map browser regression
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 4176 --bind 127.0.0.1 --directory docs >/tmp/stem-map-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4176/test/stem-dominance-map/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --virtual-time-budget=12000 \
            --dump-dom \
            "http://127.0.0.1:4176/test/stem-dominance-map/?selftest=1" \
            > /tmp/stem-map-browser.html
          grep -q 'data-stem-map-selftest="PASS"' /tmp/stem-map-browser.html
          grep -q 'stem map browser self-test: PASS' /tmp/stem-map-browser.html
          echo "Stem Dominance Map browser regression: PASS"

      - name: Vocal HTDemucs Probe regression
        run: |
          node --check docs/test/vocal-htdemucs-probe/app.js
          node tests/vocal-htdemucs-probe-regression.mjs \
            docs/test/vocal-htdemucs-probe/index.html \
            docs/test/vocal-htdemucs-probe/app.js \
            docs/test/vocal-htdemucs-probe/style.css

      - name: Setup Node for HTDemucs probe
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Vocal HTDemucs Probe
        working-directory: docs/test/vocal-htdemucs-probe
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          cp -a dist/. .
          rm -rf node_modules dist

      - name: Vocal HTDemucs Probe browser regression
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 4177 --bind 127.0.0.1 --directory docs >/tmp/vocal-htdemucs-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4177/test/vocal-htdemucs-probe/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --virtual-time-budget=12000 \
            --dump-dom \
            "http://127.0.0.1:4177/test/vocal-htdemucs-probe/?selftest=1" \
            > /tmp/vocal-htdemucs-browser.html
          grep -q 'data-htdemucs-selftest="PASS"' /tmp/vocal-htdemucs-browser.html
          grep -q 'htdemucs browser self-test: PASS' /tmp/vocal-htdemucs-browser.html
          echo "Vocal HTDemucs Probe browser regression: PASS"


      - name: Stem Annotation Studio regression
        run: node tests/stem-annotation-studio-regression.mjs docs/m6-status/stem-annotation-studio/index.html

      - name: Build Stem Annotation Studio
        working-directory: docs/m6-status/stem-annotation-studio
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          cp -a dist/. .
          rm -rf node_modules dist

      - name: Stem Annotation Studio browser regression
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo "Chrome/Chromium not found on runner"; exit 1; fi
          python3 -m http.server 4178 --bind 127.0.0.1 --directory docs >/tmp/stem-annotation-studio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do if curl -fsS http://127.0.0.1:4178/m6-status/stem-annotation-studio/ >/dev/null; then break; fi; sleep 0.25; done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=15000 --dump-dom "http://127.0.0.1:4178/m6-status/stem-annotation-studio/?selftest=1" >/tmp/stem-annotation-studio-browser.html
          grep -q 'data-stem-studio-selftest="PASS"' /tmp/stem-annotation-studio-browser.html
          grep -q 'stem studio self-test: PASS' /tmp/stem-annotation-studio-browser.html
          echo "Stem Annotation Studio browser regression: PASS"

      - name: Structure Cutter Lab regression
        run: |
          node --check docs/m6-status/structure-cutter-lab/app.js
          node tests/structure-cutter-lab-regression.mjs docs/m6-status/structure-cutter-lab
          node tests/repetition-core-test.mjs

      - name: Build Structure Cutter Lab
        working-directory: docs/m6-status/structure-cutter-lab
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          cp -a dist/. .
          rm -rf node_modules dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      - name: Validate live M6 Pages
        env:
          BASE_URL: https://2rwa.github.io/tmp-music/m6-status
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}: ${BASE_URL}"
            if curl -fsSL --max-time 15 "${BASE_URL}/" -o /tmp/m6-status.html \
              && curl -fsSL --max-time 15 "${BASE_URL}/timeline/" -o /tmp/timeline.html \
              && curl -fsSL --max-time 15 "${BASE_URL}/timeline/data/whisper-ao.json" -o /tmp/whisper.json \
              && curl -fsSL --max-time 15 "${BASE_URL}/timeline/data/jugemu.json" -o /tmp/jugemu.json \
              && curl -fsSL --max-time 15 "${BASE_URL}/timeline/data/chichinu-fiija.json" -o /tmp/chichinu.json \
              && curl -fsSL --max-time 15 "${BASE_URL}/timeline-browser/" -o /tmp/timeline-browser.html \
              && curl -fsSL --max-time 15 "${BASE_URL}/timeline-browser/app.js" -o /tmp/timeline-browser-app.js \
              && curl -fsSL --max-time 15 "${BASE_URL}/sonic-chronicle/" -o /tmp/sonic-chronicle.html \
              && curl -fsSL --max-time 15 "${BASE_URL}/sonic-chronicle/app.js" -o /tmp/sonic-chronicle-app.js; then
              grep -q "M6 Voice Quality" /tmp/m6-status.html
              grep -q "Level 1 timeline visualization" /tmp/m6-status.html
              grep -q "Voice-quality timeline" /tmp/timeline.html
              grep -q '"track":"whisper-ao"' /tmp/whisper.json
              grep -q '"track":"jugemu"' /tmp/jugemu.json
              grep -q '"track":"chichinu-fiija"' /tmp/chichinu.json
              grep -q "Browser audio analyzer" /tmp/timeline-browser.html
              grep -q "現在位置の読み方" /tmp/timeline-browser.html
              grep -q "音声タイムライン" /tmp/timeline-browser.html
              grep -q "縦型解析年表" /tmp/timeline-browser.html
              grep -q "HNR / CPPS-like" /tmp/timeline-browser.html
              grep -q "syncPlaybackUi" /tmp/timeline-browser-app.js
              grep -q "drawOverviewTimeline" /tmp/timeline-browser-app.js
              grep -q "renderChronicle" /tmp/timeline-browser-app.js
              grep -q "applyChronicleColumns" /tmp/timeline-browser-app.js
              grep -q "Sonic Chronicle" /tmp/m6-status.html
              grep -q "Sonic Chronicle" /tmp/sonic-chronicle.html
              grep -q "解析クロニクル" /tmp/sonic-chronicle.html
              grep -q "現在位置へ戻る" /tmp/sonic-chronicle.html
              grep -q "followMode" /tmp/sonic-chronicle-app.js
              grep -q "buildEntries" /tmp/sonic-chronicle-app.js
              if [ -s docs/m6-status/timeline-v2/data/whisper-ao.json ]; then
                curl -fsSL --max-time 15 "${BASE_URL}/timeline-v2/" -o /tmp/timeline-v2.html
                curl -fsSL --max-time 15 "${BASE_URL}/timeline-v2/data/whisper-ao.json" -o /tmp/v2-whisper.json
                curl -fsSL --max-time 15 "${BASE_URL}/timeline-v2/data/jugemu.json" -o /tmp/v2-jugemu.json
                curl -fsSL --max-time 15 "${BASE_URL}/timeline-v2/data/chichinu-fiija.json" -o /tmp/v2-chichinu.json
                grep -q "Continuous voice-quality timeline" /tmp/timeline-v2.html
                grep -q '"track":"whisper-ao"' /tmp/v2-whisper.json
                grep -q '"track":"jugemu"' /tmp/v2-jugemu.json
                grep -q '"track":"chichinu-fiija"' /tmp/v2-chichinu.json
                echo "M6 summary, Level 1 and Level 2 timelines are live"
              else
                echo "M6 summary and Level 1 timeline are live; Level 2 data not generated yet"
              fi
              exit 0
            fi
            sleep 5
          done
          echo "M6 Pages live validation failed"
          exit 1


      - name: Validate live Vocal Separation Lab
        env:
          LAB_URL: https://2rwa.github.io/tmp-music/test/vocal-separation-lab
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}: ${LAB_URL}"
            if curl -fsSL --max-time 15 "${LAB_URL}/" -o /tmp/vocal-lab.html && curl -fsSL --max-time 15 "${LAB_URL}/app.js" -o /tmp/vocal-lab-app.js; then
              grep -q "Vocal Separation Lab" /tmp/vocal-lab.html
              grep -q "UVR_MDXNET_KARA_2" /tmp/vocal-lab-app.js
              grep -q "web-audio-separation@0.3.1/+esm" /tmp/vocal-lab-app.js
              grep -q "createFreshSeparator" /tmp/vocal-lab-app.js
              grep -q "clearStemResults" /tmp/vocal-lab-app.js
              echo "Vocal Separation Lab is live"
              exit 0
            fi
            sleep 5
          done
          echo "Vocal Separation Lab live validation failed"
          exit 1


      - name: Validate live Vocal Model Comparator
        env:
          COMPARATOR_URL: https://2rwa.github.io/tmp-music/test/vocal-model-comparator
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}: ${COMPARATOR_URL}"
            if curl -fsSL --max-time 15 "${COMPARATOR_URL}/" -o /tmp/vocal-comparator.html \
              && curl -fsSL --max-time 15 "${COMPARATOR_URL}/app.js" -o /tmp/vocal-comparator-app.js; then
              grep -q "Vocal Model Comparator" /tmp/vocal-comparator.html
              grep -q "runComparison" /tmp/vocal-comparator-app.js
              grep -q "runBrowserSelfTest" /tmp/vocal-comparator-app.js
              echo "Vocal Model Comparator is live"
              exit 0
            fi
            sleep 5
          done
          echo "Vocal Model Comparator live validation failed"
          exit 1


      - name: Validate live Vocal Isolation Inspector
        env:
          INSPECTOR_URL: https://2rwa.github.io/tmp-music/test/vocal-isolation-inspector
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}: ${INSPECTOR_URL}"
            if curl -fsSL --max-time 15 "${INSPECTOR_URL}/" -o /tmp/vocal-inspector.html \
              && curl -fsSL --max-time 15 "${INSPECTOR_URL}/app.js" -o /tmp/vocal-inspector-app.js; then
              grep -q "Vocal Isolation Inspector" /tmp/vocal-inspector.html
              grep -q "combineBuffers" /tmp/vocal-inspector-app.js
              grep -q "runBrowserSelfTest" /tmp/vocal-inspector-app.js
              echo "Vocal Isolation Inspector is live"
              exit 0
            fi
            sleep 5
          done
          echo "Vocal Isolation Inspector live validation failed"
          exit 1


      - name: Validate live Stem Dominance Map
        env:
          STEM_MAP_URL: https://2rwa.github.io/tmp-music/test/stem-dominance-map
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}: ${STEM_MAP_URL}"
            if curl -fsSL --max-time 15 "${STEM_MAP_URL}/" -o /tmp/stem-map.html \
              && curl -fsSL --max-time 15 "${STEM_MAP_URL}/app.js" -o /tmp/stem-map-app.js; then
              grep -q "Stem Dominance Map" /tmp/stem-map.html
              grep -q "buildMap" /tmp/stem-map-app.js
              grep -q "runBrowserSelfTest" /tmp/stem-map-app.js
              echo "Stem Dominance Map is live"
              exit 0
            fi
            sleep 5
          done
          echo "Stem Dominance Map live validation failed"
          exit 1


      - name: Validate live Vocal HTDemucs Probe
        env:
          PROBE_URL: https://2rwa.github.io/tmp-music/test/vocal-htdemucs-probe
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}: ${PROBE_URL}"
            if curl -fsSL --max-time 15 "${PROBE_URL}/" -o /tmp/vocal-htdemucs.html; then
              grep -q "Vocal HTDemucs Probe" /tmp/vocal-htdemucs.html
              ASSET="$(grep -oE 'assets/[^"[:space:]]+\.js' /tmp/vocal-htdemucs.html | head -1 || true)"
              if [ -n "${ASSET}" ] && curl -fsSL --max-time 20 "${PROBE_URL}/${ASSET}" -o /tmp/vocal-htdemucs-bundle.js; then
                grep -q "htdemucs" /tmp/vocal-htdemucs-bundle.js
                echo "Vocal HTDemucs Probe is live with bundled runtime"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Vocal HTDemucs Probe live validation failed"
          exit 1


      - name: Validate live Stem Annotation Studio
        env:
          STUDIO_URL: https://2rwa.github.io/tmp-music/m6-status/stem-annotation-studio
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}: ${STUDIO_URL}"
            if curl -fsSL --max-time 15 "${STUDIO_URL}/" -o /tmp/stem-annotation-studio.html; then
              grep -q "Stem Annotation Studio" /tmp/stem-annotation-studio.html
              ASSET="$(grep -oE 'assets/[^"[:space:]]+\.js' /tmp/stem-annotation-studio.html | head -1 || true)"
              if [ -n "${ASSET}" ] && curl -fsSL --max-time 20 "${STUDIO_URL}/${ASSET}" -o /tmp/stem-annotation-studio-bundle.js; then
                grep -q "htdemucs" /tmp/stem-annotation-studio-bundle.js
                grep -q "buildStemAnnotations" /tmp/stem-annotation-studio-bundle.js
                echo "Stem Annotation Studio is live with bundled HTDemucs"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Stem Annotation Studio live validation failed"
          exit 1

