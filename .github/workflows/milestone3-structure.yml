name: Milestone 3 structure smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/milestone3-structure.yml"
      - "scripts/analyze_structure.py"
      - "scripts/common/structure.py"
      - "config/tracks/jugemu.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": "pending",
              "context": "structure/jugemu",
              "description": "multi-view recurrence analysis is running",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-core.txt
          python -m pip install -r requirements-analysis.txt

      - name: Run Jugemu multi-view structure analysis
        run: |
          set -euo pipefail
          python scripts/cli.py structure --track jugemu

      - name: Validate structure outputs
        run: |
          set -euo pipefail
          root="analysis/jugemu/measurements/structure"
          test -s "${root}/structure.json"
          test -s "${root}/ssm.npz"
          test -s "${root}/features.npz"
          test -s "${root}/lag-profile.csv"
          test -s "${root}/cycle-distance-mfcc.csv"
          test -s "${root}/cycle-distance-chroma.csv"
          test -s "${root}/cycle-distance-rhythm.csv"
          test -s "${root}/aligned-cycle-distance-mfcc.csv"
          test -s "${root}/aligned-cycle-distance-chroma.csv"
          test -s "${root}/aligned-cycle-distance-rhythm.csv"
          test -s "${root}/provenance.json"
          test -s "${root}/status.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("analysis/jugemu/measurements/structure")
          result = json.loads((root / "structure.json").read_text())
          status = json.loads((root / "status.json").read_text())
          assert status["status"] == "success", status
          assert status["outputs"], status
          assert 20.0 <= result["selected_period_s"] <= 40.0, result
          assert len(result["cycles"]) >= 5, result
          assert len(result["aligned_cycles"]) >= 5, result
          assert len(result["cycle_alignment_starts"]) >= 6, result
          assert all(abs(x["offset_s"]) <= 4.0 for x in result["cycle_alignment_starts"]), result
          assert len(result["period_candidates"]) >= 1, result
          assert set(result["views"]) == {"mfcc", "chroma", "rhythm"}, result
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: structure-jugemu
          path: analysis/jugemu/measurements/structure
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: always()
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": state,
              "context": "structure/jugemu",
              "description": f"multi-view structure analysis {state}",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY
