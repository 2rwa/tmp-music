name: M6 Level 2 time series

on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_voice_quality_timeseries.py"
      - "scripts/common/voice_quality_timeseries.py"
      - "scripts/praat/measure_cpps_hnr_timeseries.praat"
      - "scripts/export_m6_timeline_v2.py"
      - "scripts/tests/test_voice_quality_timeseries.py"
      - "docs/m6-status/timeline-v2/index.html"
      - "docs/m6-status/timeline-v2/app.js"
      - "docs/m6-status/timeline-v2/style.css"
      - ".github/workflows/m6-level2-timeseries.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: whisper-ao
            retained_demucs: true
          - track: jugemu
            retained_demucs: true
          - track: chichinu-fiija
            retained_demucs: false
    env:
      TRACK: ${{ matrix.track }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-analysis.txt
            requirements-separation.txt

      - name: Install Level 2 dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg praat
          praat --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt -r requirements-analysis.txt

      - name: Install Chichinu separation dependencies
        if: ${{ matrix.retained_demucs == false }}
        run: |
          set -euo pipefail
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-separation.txt
          python -m pip check

      - name: Download retained Demucs vocal stem
        if: ${{ matrix.retained_demucs }}
        uses: actions/download-artifact@v4
        with:
          name: demucs-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/stems/demucs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37105533830

      - name: Recreate Chichinu vocal stem
        if: ${{ matrix.retained_demucs == false }}
        run: |
          set -euo pipefail
          python scripts/cli.py verify --track "${TRACK}"
          python scripts/cli.py separate --track "${TRACK}"

      - name: Recreate selected-F0 consensus from Level 1 snapshot
        run: |
          set -euo pipefail
          mkdir -p "analysis/${TRACK}/measurements/pitch/vocals"
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          track = os.environ["TRACK"]
          data = json.loads((Path("docs/m6-status/timeline/data") / f"{track}.json").read_text())
          out = Path("analysis") / track / "measurements/pitch/vocals/consensus.csv"
          with out.open("w", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=["time_s", "selected_f0_hz", "selected_confidence"])
              writer.writeheader()
              for time_s, f0_hz, confidence in data["f0"]:
                  writer.writerow({"time_s": time_s, "selected_f0_hz": f0_hz, "selected_confidence": confidence})
          print(f"{track}: wrote {len(data['f0'])} selected-F0 observations")
          PY

      - name: Analyze Level 2 time series
        run: |
          set -euo pipefail
          python scripts/analyze_voice_quality_timeseries.py \
            "analysis/${TRACK}/stems/demucs/vocals.wav" \
            "analysis/${TRACK}/measurements/pitch/vocals/consensus.csv" \
            --out "analysis/${TRACK}/measurements/voice-quality-level2/vocals" \
            --require-praat

      - name: Validate Level 2 outputs
        run: |
          set -euo pipefail
          root="analysis/${TRACK}/measurements/voice-quality-level2/vocals"
          test -s "${root}/frame-metrics.csv"
          test -s "${root}/praat-timeseries.csv"
          test -s "${root}/summary.json"
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          root = Path("analysis") / os.environ["TRACK"] / "measurements/voice-quality-level2/vocals"
          summary = json.loads((root / "summary.json").read_text())
          frame = list(csv.DictReader((root / "frame-metrics.csv").open()))
          praat = list(csv.DictReader((root / "praat-timeseries.csv").open()))
          assert summary["measurement_status"] == "ok", summary
          assert summary["frame_series"]["row_count"] == len(frame) and len(frame) > 100, summary
          assert summary["praat_timeseries"]["row_count"] == len(praat) and len(praat) > 100, summary
          assert summary["praat_timeseries"]["version"], summary
          assert any(row["autocorrelation_hnr_db"] for row in frame), "missing autocorr HNR"
          assert any(row["local_vibrato_extent_cents_p95_p05"] for row in frame), "missing local modulation"
          assert any(row["praat_cpps_db"] for row in praat), "missing CPPS"
          assert any(row["praat_hnr_cc_db"] for row in praat), "missing Praat HNR"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: voice-quality-level2-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/measurements/voice-quality-level2/vocals
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download Level 2 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: voice-quality-level2-*
          path: .level2-downloaded

      - name: Normalize artifact directories
        run: |
          set -euo pipefail
          mkdir -p .level2-artifacts
          for track in whisper-ao jugemu chichinu-fiija; do
            src=".level2-downloaded/voice-quality-level2-${track}"
            test -d "${src}"
            mv "${src}" ".level2-artifacts/${track}"
          done

      - name: Export Level 2 Pages snapshot
        run: python scripts/export_m6_timeline_v2.py

      - name: Validate Pages snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for track in ("whisper-ao", "jugemu", "chichinu-fiija"):
              p = Path("docs/m6-status/timeline-v2/data") / f"{track}.json"
              data = json.loads(p.read_text())
              assert len(data["level2"]["frame"]) > 100, track
              assert len(data["level2"]["praat"]) > 100, track
              assert data["level1"]["register"] is not None, track
          PY

      - name: Commit Level 2 snapshot data
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/m6-status/timeline-v2/data)" ]; then
            echo "Level 2 timeline data unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/m6-status/timeline-v2/data
            git commit -m "Update M6 Level 2 timeline data"
            git push
          fi

      - name: Dispatch Pages deployment
        env:
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/pages.yml/dispatches"
          req = urllib.request.Request(
              url,
              data=json.dumps({"ref": "main"}).encode(),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              assert response.status == 204, response.status
          PY
