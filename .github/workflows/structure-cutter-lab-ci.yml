name: Structure Cutter Lab CI

on:
  push:
    branches: [main]
    paths:
      - "docs/m6-status/structure-cutter-lab/**"
      - "tests/structure-cutter-lab-regression.mjs"
      - "tests/section-ai-postprocess-test.mjs"
      - "tests/section-ai-runtime-test.mjs"
      - ".github/workflows/structure-cutter-lab-ci.yml"
  pull_request:
    paths:
      - "docs/m6-status/structure-cutter-lab/**"
      - "tests/structure-cutter-lab-regression.mjs"
      - "tests/section-ai-postprocess-test.mjs"
      - ".github/workflows/structure-cutter-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Static regression
        run: |
          node --check docs/m6-status/structure-cutter-lab/app.js
          node tests/structure-cutter-lab-regression.mjs docs/m6-status/structure-cutter-lab
          node tests/repetition-core-test.mjs
          node tests/beat-core-test.mjs
          node tests/vocal-core-test.mjs
          node tests/cut-core-test.mjs
          node tests/section-ai-postprocess-test.mjs
          node tests/section-ai-runtime-test.mjs

      - name: Build browser bundle
        working-directory: docs/m6-status/structure-cutter-lab
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -s models/harmonix-fold0-section-function-long.onnx
          cp -a dist/. .
          rm -rf node_modules dist

      - name: Browser interaction self-test
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          "$CHROME" --version
          python3 -m http.server 4181 --bind 127.0.0.1 --directory docs >/tmp/structure-cutter-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4181/m6-status/structure-cutter-lab/ >/dev/null; then break; fi
            sleep 0.25
          done
          "$CHROME"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --disable-gpu             --virtual-time-budget=12000             --dump-dom             "http://127.0.0.1:4181/m6-status/structure-cutter-lab/?selftest=1"             > /tmp/structure-cutter-browser.html
          echo "---- self-test document state ----"
          grep -oE 'data-(structure-cutter-selftest|demucs-ready|consensus-sources|section-ai-ready|section-ai-selftest|playback-source-selftest|playback-source|repetition-ready|beat-grid-ready|vocal-phrase-ready|vocal-snap-selftest|low-energy-ui-selftest)="[^"]*"' /tmp/structure-cutter-browser.html || true
          grep -o 'structure cutter self-test: [A-Z]*' /tmp/structure-cutter-browser.html || true
          grep -q 'data-structure-cutter-selftest="PASS"' /tmp/structure-cutter-browser.html
          grep -q 'data-demucs-ready="true"' /tmp/structure-cutter-browser.html
          grep -q 'data-consensus-sources="4"' /tmp/structure-cutter-browser.html
          grep -q 'data-section-ai-ready="true"' /tmp/structure-cutter-browser.html
          grep -q 'data-section-ai-selftest="PASS"' /tmp/structure-cutter-browser.html
          grep -q 'data-playback-source-selftest="PASS"' /tmp/structure-cutter-browser.html
          grep -q 'data-playback-source="mix"' /tmp/structure-cutter-browser.html
          grep -q 'data-repetition-ready="true"' /tmp/structure-cutter-browser.html
          grep -q 'data-beat-grid-ready="true"' /tmp/structure-cutter-browser.html
          grep -q 'data-vocal-phrase-ready="true"' /tmp/structure-cutter-browser.html
          grep -q 'data-vocal-snap-selftest="PASS"' /tmp/structure-cutter-browser.html
          grep -q 'data-low-energy-ui-selftest="PASS"' /tmp/structure-cutter-browser.html
          grep -q 'structure cutter self-test: PASS' /tmp/structure-cutter-browser.html
          echo "Structure Cutter Lab browser regression: PASS"
