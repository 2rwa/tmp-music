name: M6 Pages smoke

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate live M6 snapshot
        env:
          URL: https://2rwa.github.io/tmp-music/m6-status/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}: ${URL}"
            if curl -fsSL --max-time 15 "${URL}" -o /tmp/m6-status.html; then
              grep -q "M6 Voice Quality" /tmp/m6-status.html
              grep -q "Chichinu Fiija" /tmp/m6-status.html
              grep -q "M7 remains HOLD" /tmp/m6-status.html
              echo "M6 Pages snapshot is live"
              exit 0
            fi
            sleep 5
          done
          echo "M6 Pages snapshot did not become available"
          exit 1
