name: Milestone 2 pitch comparison

on:
  workflow_run:
    workflows: ["Milestone 2 vocal pitch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      vocal_run_id:
        description: "Completed vocal pitch workflow run ID"
        required: true
        type: string
      mix_run_id:
        description: "Completed mix pitch workflow run ID"
        required: true
        type: string
      source_sha:
        description: "Commit SHA shared by the analysis inputs"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  compare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        track: [whisper-ao, jugemu]
    steps:
      - name: Resolve vocal run
        id: vocal
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            echo "run_id=${EVENT_RUN_ID}" >> "${GITHUB_OUTPUT}"
          else
            echo "run_id=${{ inputs.vocal_run_id }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download vocal pitch artifact
        uses: actions/download-artifact@v4
        with:
          name: pitch-vocals-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/measurements/pitch/vocals
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.vocal.outputs.run_id }}

      - name: Resolve source commit and mix run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              print("sha=${{ inputs.source_sha }}")
              print("mix_run_id=${{ inputs.mix_run_id }}")
              raise SystemExit(0)

          context_path = (
              Path("analysis")
              / os.environ["TRACK"]
              / "measurements"
              / "pitch"
              / "vocals"
              / "source-context.json"
          )
          if not context_path.is_file():
              raise SystemExit(
                  "vocal artifact has no source-context.json; use workflow_dispatch "
                  "with explicit vocal_run_id, mix_run_id, and source_sha"
              )
          context = json.loads(context_path.read_text())
          sha = context["source_commit_sha"]

          query = urllib.parse.urlencode({
              "head_sha": sha,
              "status": "success",
              "per_page": 20,
          })
          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              f"/actions/workflows/milestone2-pitch-mix.yml/runs?{query}"
          )
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          payload = json.loads(urllib.request.urlopen(req, timeout=30).read())
          runs = payload.get("workflow_runs", [])
          if not runs:
              raise SystemExit(
                  f"no successful mix pitch workflow found for source commit {sha}; "
                  "retry this workflow after mix pitch completes"
              )
          print(f"sha={sha}")
          print(f"mix_run_id={runs[0]['id']}")
          PY

      - name: Publish pending status
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ steps.source.outputs.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRACK: ${{ matrix.track }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": "pending",
              "context": f"pitch-compare/{os.environ['TRACK']}",
              "description": "mix versus vocal pitch comparison is running",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Download mix pitch artifact
        uses: actions/download-artifact@v4
        with:
          name: pitch-mix-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/measurements/pitch/mix
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.mix_run_id }}

      - name: Compare mix and vocals
        run: |
          set -euo pipefail
          python scripts/compare_pitch_sources.py             --track "${{ matrix.track }}"             --mix "analysis/${{ matrix.track }}/measurements/pitch/mix"             --vocals "analysis/${{ matrix.track }}/measurements/pitch/vocals"             --out "analysis/${{ matrix.track }}/comparisons/pitch-mix-vs-vocals"
          test -s "analysis/${{ matrix.track }}/comparisons/pitch-mix-vs-vocals/comparison.json"
          test -s "analysis/${{ matrix.track }}/comparisons/pitch-mix-vs-vocals/measurements.md"
          test -s "analysis/${{ matrix.track }}/comparisons/pitch-mix-vs-vocals/provenance.json"
          test -s "analysis/${{ matrix.track }}/comparisons/pitch-mix-vs-vocals/status.json"

      - uses: actions/upload-artifact@v4
        with:
          name: pitch-comparison-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/comparisons/pitch-mix-vs-vocals
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: always()
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ steps.source.outputs.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TRACK: ${{ matrix.track }}
        run: |
          if [ -z "${STATUS_SHA}" ]; then
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": state,
              "context": f"pitch-compare/{os.environ['TRACK']}",
              "description": f"mix versus vocal comparison {state}",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY
