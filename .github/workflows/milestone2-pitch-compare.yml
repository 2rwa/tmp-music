name: Milestone 2 pitch comparison

on:
  workflow_run:
    workflows: ["Milestone 2 vocal pitch", "Milestone 2 mix pitch"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/milestone2-pitch-compare.yml"
  workflow_dispatch:
    inputs:
      vocal_run_id:
        description: "Completed vocal pitch workflow run ID"
        required: true
        type: string
      mix_run_id:
        description: "Completed mix pitch workflow run ID"
        required: true
        type: string
      source_sha:
        description: "Commit SHA shared by the analysis inputs"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  compare:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        track: [whisper-ao, jugemu]
    steps:
      - name: Resolve source runs
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import urllib.parse
          import urllib.request

          event_name = os.environ["EVENT_NAME"]
          if event_name == "workflow_dispatch":
              print("ready=true")
              print("sha=${{ inputs.source_sha }}")
              print("vocal_run_id=${{ inputs.vocal_run_id }}")
              print("mix_run_id=${{ inputs.mix_run_id }}")
              raise SystemExit(0)

          sha = os.environ["EVENT_HEAD_SHA"] if event_name == "workflow_run" else os.environ["CURRENT_SHA"]
          event_workflow = os.environ.get("EVENT_WORKFLOW_NAME", "")
          event_run_id = os.environ.get("EVENT_RUN_ID", "")

          def latest_success(workflow_file: str) -> str | None:
              query = urllib.parse.urlencode({
                  "head_sha": sha,
                  "status": "success",
                  "per_page": 20,
              })
              url = (
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
                  f"/actions/workflows/{workflow_file}/runs?{query}"
              )
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              payload = json.loads(urllib.request.urlopen(req, timeout=30).read())
              runs = payload.get("workflow_runs", [])
              return str(runs[0]["id"]) if runs else None

          vocal_run = (
              event_run_id
              if event_name == "workflow_run" and event_workflow == "Milestone 2 vocal pitch"
              else latest_success("milestone2-pitch-vocals.yml")
          )
          mix_run = (
              event_run_id
              if event_name == "workflow_run" and event_workflow == "Milestone 2 mix pitch"
              else latest_success("milestone2-pitch-mix.yml")
          )

          print(f"sha={sha}")
          print(f"vocal_run_id={vocal_run or ''}")
          print(f"mix_run_id={mix_run or ''}")
          ready = bool(vocal_run and mix_run)
          print(f"ready={'true' if ready else 'false'}")
          if not ready:
              missing = []
              if not vocal_run:
                  missing.append("vocal pitch")
              if not mix_run:
                  missing.append("mix pitch")
              print("reason=waiting for " + " and ".join(missing))
          PY

      - name: Report deferred comparison
        if: ${{ steps.source.outputs.ready != 'true' }}
        run: |
          echo "Comparison deferred for ${{ steps.source.outputs.sha }}: ${{ steps.source.outputs.reason }}"
          echo "This is not a failure; the workflow will run again when the counterpart pitch workflow completes."

      - uses: actions/checkout@v4
        if: ${{ steps.source.outputs.ready == 'true' }}

      - name: Download vocal pitch artifact
        if: ${{ steps.source.outputs.ready == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: pitch-vocals-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/measurements/pitch/vocals
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.vocal_run_id }}

      - name: Download mix pitch artifact
        if: ${{ steps.source.outputs.ready == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: pitch-mix-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/measurements/pitch/mix
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.mix_run_id }}

      - name: Publish pending status
        if: ${{ steps.source.outputs.ready == 'true' }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ steps.source.outputs.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRACK: ${{ matrix.track }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": "pending",
              "context": f"pitch-compare/{os.environ['TRACK']}",
              "description": "mix versus vocal pitch comparison is running",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY

      - name: Compare mix and vocals
        if: ${{ steps.source.outputs.ready == 'true' }}
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          python scripts/cli.py pitch-compare --track "${TRACK}" --source mix-vocals
          root="analysis/${TRACK}/comparisons/pitch-mix-vs-vocals"
          test -s "${root}/comparison.json"
          test -s "${root}/measurements.md"
          test -s "${root}/provenance.json"
          test -s "${root}/status.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("analysis") / os.environ["TRACK"] / "comparisons" / "pitch-mix-vs-vocals"
          status = json.loads((root / "status.json").read_text())
          comparison = json.loads((root / "comparison.json").read_text())
          assert status["status"] == "success", status
          assert status["outputs"], status
          assert comparison["track"] == os.environ["TRACK"], comparison
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ steps.source.outputs.ready == 'true' }}
        with:
          name: pitch-comparison-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/comparisons/pitch-mix-vs-vocals
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: ${{ always() && steps.source.outputs.ready == 'true' }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ steps.source.outputs.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TRACK: ${{ matrix.track }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": state,
              "context": f"pitch-compare/{os.environ['TRACK']}",
              "description": f"mix versus vocal comparison {state}",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY
