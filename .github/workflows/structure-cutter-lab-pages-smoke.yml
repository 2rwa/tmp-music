name: Structure Cutter Lab Pages smoke

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate live Structure Cutter Lab
        env:
          LAB_URL: https://2rwa.github.io/tmp-music/m6-status/structure-cutter-lab
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}: ${LAB_URL}"
            if curl -fsSL --max-time 15 "${LAB_URL}/" -o /tmp/structure-cutter.html; then
              grep -q "Structure Cutter Lab" /tmp/structure-cutter.html
              ASSET="$(grep -oE 'assets/[^"[:space:]]+\.js' /tmp/structure-cutter.html | head -1 || true)"
              if [ -n "${ASSET}" ] && curl -fsSL --max-time 20 "${LAB_URL}/${ASSET}" -o /tmp/structure-cutter-bundle.js; then
                grep -q "htdemucs" /tmp/structure-cutter-bundle.js
                grep -q "analyzeBeatGrid" /tmp/structure-cutter-bundle.js
                grep -q "analyzeVocalPhrases" /tmp/structure-cutter-bundle.js
                grep -q "alignLowEnergyRange" /tmp/structure-cutter-bundle.js
                grep -q "analyzeRepetition" /tmp/structure-cutter-bundle.js
                grep -q "analyzeStemActivity" /tmp/structure-cutter-bundle.js
                grep -q "buildConsensusBoundaries" /tmp/structure-cutter-bundle.js
                grep -q "setPlaybackSource" /tmp/structure-cutter-bundle.js
                grep -q "currentPlaybackTime" /tmp/structure-cutter-bundle.js
                grep -q "stemMergeWavBlob" /tmp/structure-cutter-bundle.js
                grep -q "Maximum 3 stems" /tmp/structure-cutter-bundle.js
                grep -q "harmonix-fold0-section-function-long.onnx" /tmp/structure-cutter-bundle.js
                grep -q "postprocessFunctionalStructure" /tmp/structure-cutter-bundle.js
                curl -fsSL --max-time 30 --range 0-1023 "${LAB_URL}/models/harmonix-fold0-section-function-long.onnx" -o /tmp/section-ai-model-prefix.bin
                test -s /tmp/section-ai-model-prefix.bin
                echo "Structure Cutter Lab is live with HTDemucs + Section AI bundle"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Structure Cutter Lab did not become available"
          exit 1
