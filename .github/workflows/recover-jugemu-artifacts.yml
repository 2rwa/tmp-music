name: Recover Jugemu artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-jugemu-artifacts.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Download successful Run 2 artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 37028472463
          github-token: ${{ github.token }}
          pattern: jugemu-*
          path: analysis/jugemu
          merge-multiple: true

      - name: Verify recovered result set
        run: |
          set -euo pipefail
          test -s analysis/jugemu/acoustic/metadata.json
          test -s analysis/jugemu/acoustic/pitch-summary.json
          test -s analysis/jugemu/repetition/repetition.json
          test -s analysis/jugemu/asr-small/metrics.json
          test -s analysis/jugemu/asr-medium/metrics.json
          find analysis/jugemu -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Commit recovered results
        id: writeback
        run: |
          set -euo pipefail
          python scripts/common/github_writeback.py "Recover Jugemu analysis artifacts" analysis/jugemu

      - name: Preserve write-back payload on failure
        if: failure() && steps.writeback.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failed-writeback-jugemu-recovery
          path: analysis/jugemu
          retention-days: 14
