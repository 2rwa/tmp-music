name: Milestone 6 voice quality

on:
  workflow_run:
    workflows: ["Milestone 2 vocal pitch"]
    types: [completed]
  push:
    branches: ["feat/m6-complete-20261003"]
    paths:
      - ".github/workflows/milestone6-voice-quality.yml"
  pull_request:
    paths:
      - ".github/workflows/milestone6-voice-quality.yml"
  workflow_dispatch:
    inputs:
      pitch_run_id:
        description: "Completed Milestone 2 vocal-pitch run ID"
        required: true
        type: string
      source_sha:
        description: "Commit SHA used by the vocal-pitch run"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  voice-quality:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        track: [whisper-ao, jugemu]
    steps:
      - name: Resolve source pitch run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            echo "run_id=${EVENT_RUN_ID}" >> "${GITHUB_OUTPUT}"
            echo "sha=${EVENT_SHA}" >> "${GITHUB_OUTPUT}"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "run_id=${{ inputs.pitch_run_id }}" >> "${GITHUB_OUTPUT}"
            echo "sha=${{ inputs.source_sha }}" >> "${GITHUB_OUTPUT}"
          else
            echo "run_id=37097541945" >> "${GITHUB_OUTPUT}"
            echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish pending status
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ steps.source.outputs.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRACK: ${{ matrix.track }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": "pending",
              "context": f"voice-quality/{os.environ['TRACK']}",
              "description": "M6 stable-vocal voice quality is running",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-analysis.txt

      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg praat
          praat --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt -r requirements-analysis.txt
          python -m pip check

      - name: Download vocal-pitch artifact
        uses: actions/download-artifact@v4
        with:
          name: pitch-vocals-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/measurements/pitch/vocals
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Resolve Demucs source run
        id: demucs
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("analysis") / os.environ["TRACK"] / "measurements" / "pitch" / "vocals" / "source-context.json"
          payload = json.loads(p.read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"demucs_run_id={payload['demucs_run_id']}", file=out)
          PY

      - name: Download Demucs vocal stem
        uses: actions/download-artifact@v4
        with:
          name: demucs-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/stems/demucs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.demucs.outputs.demucs_run_id }}

      - name: Run stable-vocal voice quality
        run: |
          set -euo pipefail
          python scripts/cli.py voice-quality --track "${{ matrix.track }}" --source vocals

      - name: Validate voice-quality outputs
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          root="analysis/${TRACK}/measurements/voice-quality/vocals"
          test -s "${root}/segments.csv"
          test -s "${root}/summary.json"
          test -s "${root}/pitch-movement-events.csv"
          test -s "${root}/register-transitions.json"
          test -s "${root}/provenance.json"
          test -s "${root}/status.json"
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          root = Path("analysis") / os.environ["TRACK"] / "measurements" / "voice-quality" / "vocals"
          summary = json.loads((root / "summary.json").read_text())
          status = json.loads((root / "status.json").read_text())
          register = json.loads((root / "register-transitions.json").read_text())
          rows = list(csv.DictReader((root / "segments.csv").open()))
          movements = list(csv.DictReader((root / "pitch-movement-events.csv").open()))
          assert status["status"] == "success", status
          assert summary["measurement_status"] == "ok", summary
          assert summary["stable_target_count_measured"] > 0, summary
          assert len(rows) == summary["stable_target_count_measured"], (len(rows), summary)
          assert summary["praat"]["enabled"] is True, summary
          assert summary["praat"]["version"], summary
          aggregates = summary["aggregate_segment_medians"]
          for metric in (
              "autocorrelation_hnr_db", "spectral_tilt_db_per_octave",
              "praat_cpps_db", "praat_hnr_cc_db",
              "praat_f1_hz", "praat_f2_hz", "praat_f3_hz",
              "vibrato_extent_cents_p95_p05",
          ):
              assert aggregates[metric]["count"] > 0, (metric, aggregates[metric])
          assert summary["pitch_movement"]["measurement_status"] == "ok", summary
          assert summary["pitch_movement"]["candidate_count"] == len(movements), summary
          assert register["candidate_count"] == len(register["candidates"]), register
          assert summary["register_transitions"]["candidate_count"] == register["candidate_count"], summary
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: voice-quality-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/measurements/voice-quality/vocals
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: ${{ always() && github.event_name == 'workflow_run' }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ steps.source.outputs.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TRACK: ${{ matrix.track }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": state,
              "context": f"voice-quality/{os.environ['TRACK']}",
              "description": f"M6 voice quality {state}",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY
