name: Milestone 2 mix pitch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/milestone2-pitch-mix.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  pitch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        track: [whisper-ao, jugemu]
    steps:
      - name: Publish pending status
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRACK: ${{ matrix.track }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": "pending",
              "context": f"pitch-mix/{os.environ['TRACK']}",
              "description": "pYIN + CREPE mix analysis is running",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-analysis.txt
            requirements-pitch-ml.txt

      - name: Install pitch dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          python -m pip install -r requirements-analysis.txt
          python -m pip install -r requirements-pitch-ml.txt

      - name: Torchcrepe known-answer smoke
        run: |
          set -euo pipefail
          python scripts/synthetic/generate_pitch_fixtures.py
          python scripts/analyze_pitch.py             tests/fixtures/generated/pitch/p1-a4-440.wav             --out /tmp/torchcrepe-smoke             --estimators pyin,crepe             --fmax 1000             --crepe-model tiny
          python - <<'PY'
          import json
          s = json.load(open("/tmp/torchcrepe-smoke/summary.json"))
          assert s["pyin"]["voiced_fraction"] > 0.9, s
          assert s["crepe"]["periodicity"]["median"] is not None, s
          assert s["consensus"]["selected_frames"] > 0, s
          PY

      - name: Run mix pitch analysis
        run: |
          set -euo pipefail
          python scripts/cli.py pitch --track "${{ matrix.track }}" --source mix
          python scripts/cli.py targets --track "${{ matrix.track }}" --source mix
          python scripts/cli.py tuning --track "${{ matrix.track }}" --source mix

      - name: Validate pitch outputs
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          root="analysis/${TRACK}/measurements/pitch/mix"
          test -s "${root}/pyin.csv"
          test -s "${root}/crepe.csv"
          test -s "${root}/consensus.csv"
          test -s "${root}/summary.json"
          test -s "${root}/targets/stable-notes.csv"
          test -s "${root}/targets/summary.json"
          test -s "${root}/tuning/tuning-models.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("analysis") / os.environ["TRACK"] / "measurements" / "pitch" / "mix"
          for p in (root, root / "targets", root / "tuning"):
              status = json.loads((p / "status.json").read_text())
              assert status["status"] == "success", (p, status)
              assert status["outputs"], (p, status)
          summary = json.loads((root / "summary.json").read_text())
          tuning = json.loads((root / "tuning" / "tuning-models.json").read_text())
          assert summary["consensus"]["frames"] > 0, summary
          assert summary["consensus"]["selected_frames"] > 0, summary
          assert summary["crepe"]["periodicity"]["median"] is not None, summary
          assert tuning["measurement_status"] in {"ok", "insufficient_stable_targets"}, tuning
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pitch-mix-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/measurements/pitch/mix
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: always()
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TRACK: ${{ matrix.track }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": state,
              "context": f"pitch-mix/{os.environ['TRACK']}",
              "description": f"Mix pitch analysis {state}",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY
