name: Milestone 2 vocal pitch

on:
  workflow_run:
    workflows: ["Milestone 2 Demucs separation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed Demucs workflow run ID"
        required: true
        type: string
      source_sha:
        description: "Commit SHA used by the Demucs run"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  pitch-vocals:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        track: [whisper-ao, jugemu]
    steps:
      - name: Resolve source run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            echo "run_id=${EVENT_RUN_ID}" >> "${GITHUB_OUTPUT}"
            echo "sha=${EVENT_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "run_id=${{ inputs.source_run_id }}" >> "${GITHUB_OUTPUT}"
            echo "sha=${{ inputs.source_sha }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish pending status
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ steps.source.outputs.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRACK: ${{ matrix.track }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": "pending",
              "context": f"pitch-vocals/{os.environ['TRACK']}",
              "description": "vocal-only pYIN + CREPE analysis is running",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-analysis.txt
            requirements-pitch-ml.txt

      - name: Install pitch dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          python -m pip install -r requirements-analysis.txt
          python -m pip install -r requirements-pitch-ml.txt

      - name: Download Demucs stem artifact
        uses: actions/download-artifact@v4
        with:
          name: demucs-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/stems/demucs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Validate downloaded vocals
        run: |
          set -euo pipefail
          test -s "analysis/${{ matrix.track }}/stems/demucs/vocals.wav"
          test -s "analysis/${{ matrix.track }}/stems/demucs/diagnostics.json"

      - name: Run vocal-only pitch analysis
        run: |
          set -euo pipefail
          python scripts/cli.py pitch --track "${{ matrix.track }}" --source vocals
          python scripts/cli.py targets --track "${{ matrix.track }}" --source vocals
          python scripts/cli.py tuning --track "${{ matrix.track }}" --source vocals

      - name: Validate pitch outputs
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          root="analysis/${TRACK}/measurements/pitch/vocals"
          test -s "${root}/pyin.csv"
          test -s "${root}/crepe.csv"
          test -s "${root}/consensus.csv"
          test -s "${root}/targets/stable-notes.csv"
          test -s "${root}/tuning/tuning-models.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("analysis") / os.environ["TRACK"] / "measurements" / "pitch" / "vocals"
          for p in (root, root / "targets", root / "tuning"):
              status = json.loads((p / "status.json").read_text())
              assert status["status"] == "success", (p, status)
              assert status["outputs"], (p, status)
          summary = json.loads((root / "summary.json").read_text())
          tuning = json.loads((root / "tuning" / "tuning-models.json").read_text())
          assert summary["consensus"]["consensus_frames"] > 0, summary
          assert tuning["target_count"] > 0, tuning
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pitch-vocals-${{ matrix.track }}
          path: analysis/${{ matrix.track }}/measurements/pitch/vocals
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: ${{ always() && github.event_name == 'workflow_run' }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ steps.source.outputs.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TRACK: ${{ matrix.track }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": state,
              "context": f"pitch-vocals/{os.environ['TRACK']}",
              "description": f"Vocal-only pitch analysis {state}",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY
