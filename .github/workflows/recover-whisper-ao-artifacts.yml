name: Recover Whisper AO artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-whisper-ao-artifacts.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Download successful Run 5 artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 37028301049
          github-token: ${{ github.token }}
          pattern: analysis-*
          path: analysis/whisper-ao
          merge-multiple: true

      - name: Verify recovered result set
        run: |
          set -euo pipefail
          test -s analysis/whisper-ao/acoustic-auto/metadata.json
          test -s analysis/whisper-ao/acoustic-auto/pitch-summary.json
          test -s analysis/whisper-ao/acoustic-auto/spectrogram.png
          test -s analysis/whisper-ao/asr-small-full/metrics.json
          test -s analysis/whisper-ao/asr-medium-full/metrics.json
          find analysis/whisper-ao -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Commit recovered results
        run: |
          set -euo pipefail
          python scripts/common/github_writeback.py "Recover Whisper AO analysis artifacts" analysis/whisper-ao
