name: Analysis cheap CI

on:
  push:
    branches: [main]
    paths:
      - "scripts/cli.py"
      - "scripts/analyze_pitch.py"
      - "scripts/analyze_voice_quality.py"
      - "scripts/analyze_voice_quality_timeseries.py"
      - "scripts/export_m6_timeline_v2.py"
      - "scripts/japanese_metrics.py"
      - "scripts/analyze_structure.py"
      - "scripts/analyze_cycle_asr.py"
      - "scripts/align_lyrics.py"
      - "scripts/detect_pitch_targets.py"
      - "scripts/analyze_tuning.py"
      - "scripts/compare_pitch_sources.py"
      - "scripts/separate_vocals.py"
      - "scripts/common/**"
      - "scripts/synthetic/**"
      - "scripts/tests/**"
      - "config/tracks/**"
      - "requirements-core.txt"
      - "requirements-pitch-ml.txt"
      - "requirements-japanese.txt"
      - "requirements-alignment.txt"
      - "requirements-analysis.txt"
      - ".github/workflows/milestone6-voice-quality.yml"
      - ".github/workflows/milestone2-pitch-compare.yml"
      - ".github/workflows/m6-holdout-acoustic.yml"
      - ".github/workflows/analysis-ci.yml"
      - ".github/workflows/m6-timeline-export.yml"
      - ".github/workflows/m6-level2-timeseries.yml"
      - "scripts/export_m6_timeline.py"
      - "docs/m6-status/timeline/index.html"
      - "docs/m6-status/timeline/app.js"
      - "docs/m6-status/timeline/style.css"
      - "docs/m6-status/**"
      - "m6-status/**"
      - "tests/sonic-chronicle-regression.mjs"
  pull_request:
    paths:
      - "scripts/cli.py"
      - "scripts/analyze_pitch.py"
      - "scripts/analyze_voice_quality.py"
      - "scripts/analyze_voice_quality_timeseries.py"
      - "scripts/export_m6_timeline_v2.py"
      - "scripts/japanese_metrics.py"
      - "scripts/analyze_structure.py"
      - "scripts/analyze_cycle_asr.py"
      - "scripts/align_lyrics.py"
      - "scripts/detect_pitch_targets.py"
      - "scripts/analyze_tuning.py"
      - "scripts/compare_pitch_sources.py"
      - "scripts/separate_vocals.py"
      - "scripts/common/**"
      - "scripts/synthetic/**"
      - "scripts/tests/**"
      - "config/tracks/**"
      - "requirements-core.txt"
      - "requirements-pitch-ml.txt"
      - "requirements-japanese.txt"
      - "requirements-alignment.txt"
      - "requirements-analysis.txt"
      - ".github/workflows/milestone6-voice-quality.yml"
      - ".github/workflows/milestone2-pitch-compare.yml"
      - ".github/workflows/m6-holdout-acoustic.yml"
      - ".github/workflows/analysis-ci.yml"
      - ".github/workflows/m6-timeline-export.yml"
      - ".github/workflows/m6-level2-timeseries.yml"
      - "scripts/export_m6_timeline.py"
      - "docs/m6-status/timeline/index.html"
      - "docs/m6-status/timeline/app.js"
      - "docs/m6-status/timeline/style.css"
      - "docs/m6-status/**"
      - "m6-status/**"
      - "tests/sonic-chronicle-regression.mjs"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  cheap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending status
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": "pending",
              "context": "analysis-cheap-ci",
              "description": "Analyzer foundation cheap checks are running",
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependency
        run: python -m pip install -r requirements-core.txt
      - name: Compile
        run: |
          python -m py_compile \
            scripts/cli.py \
            scripts/common/schema.py \
            scripts/common/provenance.py \
            scripts/common/separation.py \
            scripts/common/pitch.py \
            scripts/common/voice_quality.py \
            scripts/common/voice_quality_timeseries.py \
            scripts/common/structure.py \
            scripts/common/japanese.py \
            scripts/separate_vocals.py \
            scripts/analyze_pitch.py \
            scripts/analyze_voice_quality.py \
            scripts/analyze_voice_quality_timeseries.py \
            scripts/export_m6_timeline_v2.py \
            scripts/analyze_structure.py \
            scripts/analyze_cycle_asr.py \
            scripts/align_lyrics.py \
            scripts/japanese_metrics.py \
            scripts/detect_pitch_targets.py \
            scripts/analyze_tuning.py \
            scripts/compare_pitch_sources.py \
            scripts/synthetic/generate_pitch_fixtures.py \
            scripts/synthetic/generate_rhythm_fixtures.py \
            scripts/synthetic/generate_structure_fixtures.py
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Generate synthetic fixtures
        run: |
          python scripts/synthetic/generate_pitch_fixtures.py
          python scripts/synthetic/generate_rhythm_fixtures.py
          python scripts/synthetic/generate_structure_fixtures.py
          test -s tests/fixtures/generated/pitch/manifest.json
          test -s tests/fixtures/generated/rhythm/manifest.json
          test -s tests/fixtures/generated/structure/manifest.json
          test -s tests/fixtures/generated/structure/s1-aaaa.npz
      - name: Verify benchmark sources and common CLI plan
        run: |
          python scripts/cli.py verify --track whisper-ao
          python scripts/cli.py verify --track jugemu
          python scripts/cli.py verify --track chichinu-fiija
          python scripts/cli.py full --track whisper-ao --dry-run
          python scripts/cli.py full --track jugemu --dry-run
          python scripts/cli.py voice-quality --track whisper-ao --source vocals --dry-run
          python scripts/cli.py voice-quality --track jugemu --source vocals --dry-run
          python scripts/cli.py separate --track chichinu-fiija --dry-run
          python scripts/cli.py pitch --track chichinu-fiija --source vocals --dry-run
          python scripts/cli.py targets --track chichinu-fiija --source vocals --dry-run
          python scripts/cli.py tuning --track chichinu-fiija --source vocals --dry-run
          python scripts/cli.py voice-quality --track chichinu-fiija --source vocals --dry-run
      - name: Validate M6 timeline source
        run: |
          set -euo pipefail
          python -m py_compile scripts/export_m6_timeline.py
          node --check docs/m6-status/timeline/app.js
          node --check docs/m6-status/timeline-v2/app.js
          test -s docs/m6-status/timeline/index.html
          test -s docs/m6-status/timeline/style.css
          test -s docs/m6-status/timeline-v2/index.html
          test -s docs/m6-status/timeline-v2/style.css
          test -s docs/m6-status/sonic-chronicle/index.html
          test -s docs/m6-status/sonic-chronicle/style.css
          test -s docs/m6-status/sonic-chronicle/app.js
          test -s docs/m6-status/sonic-chronicle/DESIGN.md
          node --check docs/m6-status/sonic-chronicle/app.js
          node tests/sonic-chronicle-regression.mjs \
            docs/m6-status/sonic-chronicle/app.js \
            docs/m6-status/sonic-chronicle/index.html \
            docs/m6-status/sonic-chronicle/style.css

      - name: Validate M6 status page
        run: |
          set -euo pipefail
          test -s docs/m6-status/index.html
          test -s docs/m6-status/data.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/m6-status/data.json").read_text())
          assert data["status"] == "COMPLETE", data
          assert data["m7"] == "HOLD", data
          assert len(data["tracks"]) == 3, data
          assert all(track["stable_targets"] > 0 for track in data["tracks"]), data
          assert all(track["pitch_movement_candidates"] >= 0 for track in data["tracks"]), data
          html = Path("docs/m6-status/index.html").read_text()
          assert "M6 Voice Quality" in html
          assert "Chichinu Fiija" in html
          PY

      - name: Publish final status
        if: always()
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          description = "Analyzer foundation cheap checks passed" if state == "success" else "Analyzer foundation cheap checks failed"
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          body = json.dumps({
              "state": state,
              "context": "analysis-cheap-ci",
              "description": description,
              "target_url": os.environ["STATUS_RUN_URL"],
          }).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req, timeout=30).read()
          PY
