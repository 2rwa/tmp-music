name: Section AI ONNX probe

on:
  push:
    branches: [main]
    paths:
      - "tools/section_ai_onnx_probe.py"
      - "tools/section-ai-ortweb-probe/**"
      - "tools/section-ai-feature-probe/**"
      - "tools/section_ai_feature_reference.py"
      - ".github/workflows/section-ai-onnx-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal CPU probe dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0"
          python -m pip install numpy hydra-core omegaconf onnx onnxruntime onnxscript tqdm "madmom-infer>=0.1.0"

      - name: Checkout pinned All-In-One source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/openmirlab/all-in-one-infer.git upstream-allin1
          git -C upstream-allin1 checkout 797f1d21b115955ed81ff9161440334fefea8855

      - name: Generate Section AI feature reference
        env:
          ALLIN1_SOURCE_DIR: upstream-allin1
        run: |
          set -euo pipefail
          python tools/section_ai_feature_reference.py section-ai-probe/feature-reference
          cat section-ai-probe/feature-reference/reference.json

      - name: Export one Harmonix fold
        env:
          SECTION_AI_PROBE_OUT: section-ai-probe
          ALLIN1_SOURCE_DIR: upstream-allin1
        run: |
          set -euo pipefail
          python tools/section_ai_onnx_probe.py
          cat section-ai-probe/report.json

      - name: Summarize probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("section-ai-probe/report.json").read_text())
          print("export_ok:", p.get("export_ok"))
          print("ort_ok:", p.get("ort_ok"))
          print("exporter:", p.get("exporter"))
          print("onnx_bytes:", p.get("onnx_bytes"))
          print("config:", p.get("config"))
          print("dynamic:", p.get("dynamic"))
          print("fixed_scaling:", p.get("fixed_scaling"))
          print("dynamo_dynamic:", p.get("dynamo_dynamic"))
          for a in p.get("attempts", []):
              print(a)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate browser feature parity
        working-directory: tools/section-ai-feature-probe
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node feature-test.mjs ../../section-ai-probe/feature-reference

      - name: Build ORT Web probe
        working-directory: tools/section-ai-ortweb-probe
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          cp ../../section-ai-probe/harmonix-fold0-section-function.onnx dist/model.onnx
          mkdir -p dist/ort-wasm
          cp node_modules/onnxruntime-web/dist/*.wasm dist/ort-wasm/
          cp node_modules/onnxruntime-web/dist/ort-wasm*.mjs dist/ort-wasm/
          test -s dist/model.onnx

      - name: Browser ORT Web probe
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found"
            exit 1
          fi
          python3 -m http.server 4182 --bind 127.0.0.1 --directory tools/section-ai-ortweb-probe/dist >/tmp/section-ai-ortweb-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4182/ >/dev/null; then break; fi
            sleep 0.25
          done
          "$CHROME"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --enable-unsafe-webgpu             --use-webgpu-adapter=swiftshader             --enable-dawn-features=allow_unsafe_apis             --disable-dawn-features=use_dxc             --enable-webgpu-developer-features             --use-gpu-in-tests             --virtual-time-budget=50000             --dump-dom             "http://127.0.0.1:4182/"             > /tmp/section-ai-ortweb.html || true
          cat /tmp/section-ai-ortweb.html
          RESULT="$(grep -oE 'data-section-ai-ortweb="[^"]+"' /tmp/section-ai-ortweb.html | head -1 || true)"
          PROVIDER="$(grep -oE 'data-provider="[^"]+"' /tmp/section-ai-ortweb.html | head -1 || true)"
          echo "ORT Web result: ${RESULT}"
          echo "ORT Web provider: ${PROVIDER}"
          if grep -Eq 'data-section-ai-ortweb="(WEBGPU_PASS|WEBGPU_FAIL_WASM_PASS|NO_WEBGPU_WASM_PASS)"' /tmp/section-ai-ortweb.html; then
            exit 0
          fi
          echo "ORT Web could not execute the exported graph"
          exit 1

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: section-ai-onnx-probe
          path: section-ai-probe/
          retention-days: 7
